[package]
name = "mod-storage"
version = "0.5.0"
edition = "2024"

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
# Stacks with components cross to the client as typed JSON (nbtjson.rs); the version the engine lock pins.
serde_json = "1.0.151"

